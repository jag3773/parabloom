[package]
name = "parabloom"
version = "0.1.0"
edition = "2024"
description = "Expand partial PDF highlights to cover the full paragraph"
license = "MIT"
repository = "https://github.com/jag3773/parabloom"
readme = "README.md"
keywords = ["pdf", "highlight", "annotation", "mupdf"]
categories = ["command-line-utilities"]

[profile.release]
strip = true
lto = "thin"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.11"
mupdf = { version = "0.8.0", default-features = false, features = ["base14-fonts"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

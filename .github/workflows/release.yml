name: Release

# Two ways to release, both from main (see RELEASING.md):
# - Run this workflow from the Actions tab with the version from Cargo.toml.
#   It creates the vMAJOR.MINOR.PATCH tag itself, after every build passes.
# - Push a vMAJOR.MINOR.PATCH tag on main.
# Either way the workflow builds and publishes a GitHub release, then
# publishes to crates.io. Pull requests that touch release inputs run every
# step except publishing, so the release path is exercised beforehand.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, exactly as in Cargo.toml (for example 0.1.0)"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - tools/release.py
      - CHANGELOG.md
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: 1.100.0

jobs:
  prepare:
    name: Check release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
      create_tag: ${{ steps.meta.outputs.create_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: meta
        name: Check tag, version, changelog and branch
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          create_tag=false
          case "$EVENT" in
            push)
              tag="$REF_NAME"
              python3 tools/release.py check "$tag"
              git fetch --quiet origin main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::$tag does not point to a commit on main"
                exit 1
              fi
              publish=true
              ;;
            workflow_dispatch)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                echo "::error::Run the release from main, not $GITHUB_REF"
                exit 1
              fi
              tag="v$INPUT_VERSION"
              python3 tools/release.py check "$tag"
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
                echo "::error::$tag already exists; bump the version to release again"
                exit 1
              fi
              publish=true
              create_tag=true
              ;;
            *)
              tag="v$(python3 tools/release.py version)"
              python3 tools/release.py check "$tag" --allow-unreleased
              publish=false
              ;;
          esac
          {
            echo "tag=$tag"
            echo "publish=$publish"
            echo "create_tag=$create_tag"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
      # Applies to rustc and to the C compiler building MuPDF.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v5
      # No build cache: release binaries are always built from scratch.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Check the binary
        run: |
          bin="target/$TARGET/release/parabloom"
          expected="parabloom ${TAG#v}"
          actual="$("$bin" --version)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::expected '$expected', got '$actual'"
            exit 1
          fi
          file "$bin"
          if [ "$RUNNER_OS" = Linux ]; then ldd "$bin"; else otool -L "$bin"; fi
      - name: Package
        run: |
          name="parabloom-$TAG-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/parabloom" README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  source:
    name: Vendored source archive
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # The binaries statically link AGPL-3.0 MuPDF, so each release carries
      # the complete corresponding source, with every crate (including the
      # MuPDF C sources in mupdf-sys) vendored for an offline build.
      - name: Package source with vendored dependencies
        run: |
          name="parabloom-$TAG-source"
          mkdir -p dist
          git archive --format=tar --prefix="$name/" HEAD | tar -C dist -x
          cd "dist/$name"
          mkdir .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          cargo metadata --offline --locked --format-version 1 > /dev/null
          cd ..
          tar -czf "$name.tar.gz" "$name"
          rm -r "$name"
          ls -lh
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  crate:
    name: Package crate
    needs: [prepare, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      # Packages the crate and builds it from the package, exactly as
      # crates.io would receive it, without uploading.
      - name: Dry-run crates.io publish
        run: cargo publish --dry-run --locked

  publish:
    name: Publish GitHub release
    needs: [prepare, build, source, crate]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - name: Write release notes
        run: |
          python3 tools/release.py notes "${TAG#v}" > notes.md
          cat >> notes.md <<EOF

          ## Install

          Install from crates.io (builds MuPDF from source, so it needs a C toolchain and \`libclang\`):

          \`\`\`bash
          cargo install parabloom --locked
          \`\`\`

          Or download the archive for your platform, check it, and put \`parabloom\` on your \`PATH\`:

          \`\`\`bash
          shasum -a 256 -c SHA256SUMS --ignore-missing
          tar -xzf parabloom-$TAG-<target>.tar.gz
          \`\`\`

          Linux binaries are built on Ubuntu 24.04 and need a glibc at least that recent. macOS binaries target macOS 11 and later and are not notarized; if macOS blocks the binary, run \`xattr -d com.apple.quarantine parabloom\`.

          To confirm an archive was built by this repository's release workflow:

          \`\`\`bash
          gh attestation verify parabloom-$TAG-<target>.tar.gz --repo $GITHUB_REPOSITORY
          \`\`\`

          ## License

          Parabloom's source is MIT licensed. The binaries statically link MuPDF, which is AGPL-3.0, so they are distributed under the AGPL. \`parabloom-$TAG-source.tar.gz\` is the complete corresponding source, with all dependencies vendored; build it offline with \`cargo build --release --frozen\`.
          EOF
          cat notes.md
      # A manual run tags the commit it built, and only once every build
      # passed, so a failed run leaves nothing to clean up. The tag is pushed
      # with GITHUB_TOKEN, which does not start a second release run.
      - name: Create tag
        if: needs.prepare.outputs.create_tag == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Parabloom ${TAG#v}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Create release
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Parabloom $TAG" \
            --notes-file notes.md \
            --verify-tag

  crates-io:
    name: Publish to crates.io
    # After the GitHub release, so binaries ship even if crates.io has a
    # problem; this job can then be re-run on its own.
    needs: [prepare, publish]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: "Crates Publishing"
      url: https://crates.io/crates/parabloom
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          version="${TAG#v}"
          # A crates.io version can never be replaced, so a re-run after a
          # successful upload skips instead of failing.
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "parabloom-release-workflow" \
            "https://crates.io/api/v1/crates/parabloom/$version")"
          if [ "$status" = 200 ]; then
            echo "parabloom $version is already on crates.io"
            exit 0
          fi
          cargo publish --locked
